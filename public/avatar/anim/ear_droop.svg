<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
/* หูกระดิก: ทำงานเฉพาะเมื่อไฟล์นี้ถูกโหลดผ่านแท็กรูปภาพบนหน้าจอ (ดู app/utils/avatar-layer-src.ts)
   .ear-l / .ear-r = หูซ้าย / หูขวา  transform-origin = จุดหมุน (โคนหู) หน่วยเป็นพิกเซลของ viewBox 500x500
   5.2s / 6.1s = ความเร็วรอบกระดิกของแต่ละข้าง  rotate(...deg) = องศาที่หูแกว่ง  1.3s = หน่วงให้สองหูไม่กระดิกพร้อมกัน */
.ear-l,.ear-r{transform-box:view-box}
.ear-l{transform-origin:187.3px 235px;animation:ear-l 5.2s ease-in-out infinite}
.ear-r{transform-origin:286.3px 235px;animation:ear-r 6.1s ease-in-out 1.3s infinite}
@keyframes ear-l{0%,55%,100%{transform:rotate(0)}62%{transform:rotate(-7deg)}70%{transform:rotate(3deg)}78%{transform:rotate(-3deg)}86%{transform:rotate(0)}}
@keyframes ear-r{0%,40%,100%{transform:rotate(0)}48%{transform:rotate(7deg)}56%{transform:rotate(-3deg)}64%{transform:rotate(3deg)}72%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.ear-l,.ear-r{animation:none}}
</style>
